# Tilføj til ~/printer_data/config/moonraker.conf på Pi'en (eller ret eksisterende sektioner)

[authorization]
trusted_clients:
    192.168.68.0/24      # LAN – inkl. Tower (PrintHub) og Obico
    127.0.0.0/8
cors_domains:
    http://192.168.68.58:8095
    *.local
    *://localhost:*

[history]                 # print-historik (bruges af "Seneste prints")

[job_queue]
load_on_startup: True
automatic_transition: False   # True = næste job starter selv. KUN hvis du har print-fjerner/print-ark-skift!
job_transition_delay: 5

[file_manager]
enable_object_processing: True   # gør det muligt at annullere enkelte objekter

# Valgfrit: lad Moonraker selv slukke printeren via smart-plug i Home Assistant
#[power printer]
